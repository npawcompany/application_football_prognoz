<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Football Prognoz — дизайн-проект</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1b2336;
      --surface: #272f42;
      --accent: #22c55e;
      --draw: #f59e0b;
      --away: #ef4444;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --glass: rgba(255,255,255,0.12);
      --blur: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Fira Sans", sans-serif;
      background: #071018;
      color: var(--fg);
    }
    button { font-family: inherit; cursor: pointer; }
    .studio {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 18px;
      background: #0b1220;
      border-bottom: 1px solid var(--glass);
      flex-wrap: wrap;
    }
    .toolbar h1 {
      font-family: "Fira Code", monospace;
      font-size: 14px;
      margin: 0 16px 0 0;
      letter-spacing: 0.04em;
    }
    .seg { display: flex; gap: 6px; flex-wrap: wrap; }
    .seg button, .nav-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--glass);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .seg button.is-on, .nav-btn.is-on {
      color: #0f172a;
      background: var(--accent);
      border-color: var(--accent);
    }
    .stage-wrap {
      overflow: auto;
      padding: 28px;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(34,197,94,0.08), transparent 50%),
        repeating-linear-gradient(90deg, transparent 0 47px, rgba(34,197,94,0.04) 48px 48px),
        #071018;
    }
    .stage {
      margin: 0 auto;
      transition: width 220ms ease, height 220ms ease;
    }
    .stage[data-size="1920"] { width: 1920px; height: 1080px; }
    .stage[data-size="1440"] { width: 1440px; height: 900px; }
    .stage[data-size="1024"] { width: 1024px; height: 768px; }
    .stage[data-size="800"] { width: 800px; height: 640px; }
    .desktop {
      width: 100%;
      height: 100%;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(160deg, #0b1a14, #0f172a 45%, #111827);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    }
    .window {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: rgba(15,23,42,0.92);
      border: 1px solid var(--glass);
      backdrop-filter: blur(var(--blur));
      overflow: hidden;
    }
    .stage[data-size="1920"] .window.primary {
      inset: 64px auto auto 56px;
      width: 1100px;
      height: 720px;
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    }
    .stage[data-size="1920"] .window.secondary {
      display: flex;
      inset: 180px 48px 80px auto;
      width: 720px;
      height: 640px;
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .stage:not([data-size="1920"]) .window.secondary { display: none; }
    .chrome {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--glass);
      flex-shrink: 0;
    }
    .dots { display: flex; gap: 8px; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .dots .c { background: #ff5f57; }
    .dots .m { background: #febc2e; }
    .dots .x { background: #28c840; }
    .chrome-title { font-size: 13px; color: var(--muted); }
    .content {
      flex: 1;
      overflow: auto;
      padding: 28px 28px 12px;
    }
    .title { font-family: "Fira Code", monospace; font-size: 28px; margin: 0; }
    .sub { color: var(--muted); margin: 6px 0 18px; font-size: 13px; }
    .grid {
      display: grid;
      gap: 12px;
    }
    .stage[data-size="1440"] .grid,
    .stage[data-size="1920"] .grid { grid-template-columns: repeat(3, 1fr); }
    .stage[data-size="1024"] .grid { grid-template-columns: repeat(2, 1fr); }
    .stage[data-size="800"] .grid { grid-template-columns: 1fr; }
    .card {
      background: var(--card);
      border: 1px solid var(--glass);
      border-radius: 12px;
      padding: 18px;
      min-height: 148px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: inherit;
      text-align: left;
    }
    .card:hover { border-color: rgba(34,197,94,0.45); }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .crest {
      width: 40px; height: 40px; object-fit: contain; background: var(--surface);
      border-radius: 8px; padding: 4px;
    }
    .crest.sm { width: 28px; height: 28px; }
    .mono {
      width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center;
      font-size: 11px; font-weight: 700;
    }
    .badge {
      background: var(--surface); border-radius: 8px; padding: 4px 8px; font-size: 12px;
      font-family: "Fira Code", monospace;
    }
    .go { margin-top: auto; text-align: right; color: var(--accent); font-size: 12px; }
    .tabs {
      height: 64px;
      display: flex;
      justify-content: center;
      gap: 28px;
      align-items: center;
      border-top: 1px solid var(--glass);
      flex-shrink: 0;
    }
    .tab { text-align: center; color: var(--muted); font-size: 12px; background: none; border: 0; }
    .tab.is-on { color: var(--accent); }
    .disclaimer {
      display: flex; gap: 10px; align-items: center;
      border: 1px solid var(--glass); border-radius: 10px; padding: 12px 14px;
      color: var(--muted); font-size: 13px; margin-bottom: 16px;
    }
    .match {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--glass);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      width: 100%;
      text-align: left;
      color: inherit;
    }
    .match .when { width: 120px; }
    .match .pair { display: flex; flex: 1; align-items: center; gap: 12px; min-width: 240px; }
    .vs { background: var(--surface); border-radius: 8px; padding: 4px 8px; font-size: 11px; color: var(--muted); }
    .team { display: flex; gap: 8px; align-items: center; font-weight: 600; }
    .team.away { justify-content: flex-end; }
    .cta {
      background: var(--accent); color: #0f172a; border: 0; border-radius: 8px;
      padding: 8px 14px; font-weight: 600; font-size: 12px;
    }
    .bar { display: flex; height: 44px; border-radius: 8px; overflow: hidden; margin: 8px 0 12px; font-weight: 700; }
    .bar span { display: grid; place-items: center; }
    .facts { display: grid; gap: 12px; }
    .stage[data-size="1440"] .facts,
    .stage[data-size="1920"] .facts { grid-template-columns: repeat(4, 1fr); }
    .stage[data-size="1024"] .facts { grid-template-columns: repeat(2, 1fr); }
    .stage[data-size="800"] .facts { grid-template-columns: 1fr; }
    .fact { background: var(--card); border: 1px solid var(--glass); border-radius: 12px; padding: 16px; }
    .fact small { color: var(--muted); display: block; margin-bottom: 8px; }
    .outcomes { display: flex; gap: 8px; margin: 10px 0; }
    .outcome {
      flex: 1; background: var(--surface); border: 1px solid var(--glass);
      border-radius: 12px; padding: 12px; text-align: center;
    }
    .outcome.is-fav { border-color: var(--accent); }
    .outcome .pct { font-family: "Fira Code", monospace; font-size: 28px; font-weight: 700; margin: 4px 0; }
    .outcome .hint { font-size: 11px; color: var(--muted); min-height: 16px; }
    .outcome.is-fav .hint { color: var(--accent); font-weight: 600; }
    .mix { display: flex; gap: 4px; height: 10px; margin-top: 4px; }
    .mix i { display: block; border-radius: 8px; height: 10px; }
    .scoreboard { display: flex; gap: 20px; align-items: flex-start; min-height: auto; }
    .scoreboard .digits { font-family: "Fira Code", monospace; font-size: 40px; font-weight: 700; margin: 4px 0 8px; }
    .chip { display: inline-block; background: var(--accent); color: #0f172a; border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
    .meters { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .meter-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .meter-row b { color: var(--fg); font-family: "Fira Code", monospace; font-weight: 600; }
    .meter { height: 8px; border-radius: 6px; background: var(--surface); overflow: hidden; display: flex; }
    .meter span { display: block; height: 8px; border-radius: 6px; }
    .pills { display: flex; gap: 4px; }
    .pill { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #0f172a; }
    .pill.w { background: var(--accent); }
    .pill.d { background: var(--draw); }
    .pill.l { background: var(--away); }
    .stage[data-size="800"] .scoreboard { flex-direction: column; }
    .form {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
    }
    .stage[data-size="800"] .form,
    .stage[data-size="1024"] .form { grid-template-columns: 1fr; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    .field {
      background: #121a2b; border: 1px solid var(--glass); border-radius: 10px;
      padding: 12px 14px; margin-bottom: 12px; color: var(--fg);
    }
    .aside { background: var(--card); border: 1px solid var(--glass); border-radius: 12px; padding: 24px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="studio">
    <header class="toolbar">
      <h1>FOOTBALL PROGNOZ · DESIGN</h1>
      <div class="seg" id="sizes">
        <button data-size="1920" class="is-on">1920 · два окна</button>
        <button data-size="1440">1440</button>
        <button data-size="1024">1024</button>
        <button data-size="800">800</button>
      </div>
      <div class="seg" id="screens">
        <button data-screen="leagues" class="is-on">Лиги</button>
        <button data-screen="calendar">Календарь</button>
        <button data-screen="forecast">Прогноз</button>
        <button data-screen="settings">Настройки</button>
      </div>
    </header>
    <div class="stage-wrap">
      <div class="stage" data-size="1920" id="stage">
        <div class="desktop">
          <section class="window primary" id="main-window"></section>
          <section class="window secondary" id="second-window"></section>
        </div>
      </div>
    </div>
  </div>
  <script>
    const CREST = (file) => `../assets/crests/${file}`;
    const LEAGUES = [
      ["PL","Premier League","Англия","leagues/PL.png"],
      ["PD","Primera Division","Испания","leagues/PD.png"],
      ["SA","Serie A","Италия","leagues/SA.png"],
      ["BL1","Bundesliga","Германия","leagues/BL1.png"],
      ["FL1","Ligue 1","Франция","leagues/FL1.png"],
      ["PPL","Primeira Liga","Португалия","leagues/PPL.png"],
      ["DED","Eredivisie","Нидерланды","leagues/DED.png"],
      ["ELC","Championship","Англия","leagues/ELC.png"],
      ["CL","UEFA Champions League","Европа","leagues/CL.png"],
      ["EC","UEFA European Championship","Европа","leagues/EC.png"],
      ["BSA","Campeonato Brasileiro","Бразилия",""],
      ["WC","FIFA World Cup","Мир",""],
    ];
    const MATCHES = [
      ["Arsenal","Chelsea","57-arsenal","61-chelsea","21.09.2026","16:30 UTC"],
      ["Manchester City","Manchester United","65-mancity","66-manutd","21.09.2026","18:45 UTC"],
      ["Liverpool","Tottenham Hotspur","64-liverpool","73-tottenham","22.09.2026","14:00 UTC"],
      ["Newcastle United","Aston Villa","67-newcastle","58-astonvilla","22.09.2026","19:00 UTC"],
    ];
    const MONO = { BSA: ["BSA","#009739"], WC: ["WC","#326295"] };

    function crestImg(file, alt, cls) {
      if (!file) {
        const [letters, color] = MONO[alt] || [alt.slice(0,3), "#272f42"];
        return `<span class="mono" style="background:${color}">${letters}</span>`;
      }
      return `<img class="crest ${cls||""}" src="${CREST(file)}" alt="${alt}" />`;
    }
    function chrome(title) {
      return `<div class="chrome"><div class="dots"><i class="c"></i><i class="m"></i><i class="x"></i></div>
        <div class="chrome-title">${title}</div><div></div></div>`;
    }
    function tabs(active) {
      const items = [["leagues","Лиги"],["calendar","Календарь"],["forecast","Прогноз"],["settings","Настройки"]];
      return `<nav class="tabs">${items.map(([id,label]) =>
        `<button class="tab ${id===active?"is-on":""}" data-screen="${id}">${label}</button>`).join("")}</nav>`;
    }
    function leagues() {
      return `${chrome("Football Prognoz — Лиги")}
        <div class="content">
          <h2 class="title">Лиги</h2>
          <p class="sub">Бесплатный план football-data.org: 12 соревнований.</p>
          <div class="grid">${LEAGUES.map(([code,name,country,file]) => `
            <button class="card" data-screen="calendar">
              <div class="card-top">${crestImg(file, code)}<span class="badge">${code}</span></div>
              <strong>${name}</strong><span class="sub" style="margin:0">${country}</span>
              <div class="go">Открыть календарь →</div>
            </button>`).join("")}</div>
        </div>${tabs("leagues")}`;
    }
    function calendar() {
      return `${chrome("Football Prognoz — Календарь матчей")}
        <div class="content">
          <p class="sub" style="margin:0">Premier League</p>
          <h2 class="title">Предстоящие матчи</h2>
          <div class="disclaimer">Прогноз статистический. Это не совет ставить деньги. Используйте данные исключительно в целях спортивной аналитики.</div>
          ${MATCHES.map(([h,a,hc,ac,d,t]) => `
            <button class="match" data-screen="forecast">
              <div class="when"><div>${d}</div><small style="color:var(--muted)">${t}</small></div>
              <div class="pair">
                <div class="team">${crestImg("teams/"+hc+".png", h, "sm")}${h}</div>
                <span class="vs">VS</span>
                <div class="team away">${a}${crestImg("teams/"+ac+".png", a, "sm")}</div>
              </div>
              <span class="badge">SCHEDULED</span>
              <span class="cta">Прогноз</span>
            </button>`).join("")}
        </div>${tabs("calendar")}`;
    }
    function forecast() {
      return `${chrome("Football Prognoz — Аналитика матча")}
        <div class="content">
          <p class="sub" style="margin:0">Прогноз матча</p>
          <h2 class="title" style="display:flex;gap:12px;align-items:center">
            ${crestImg("teams/57-arsenal.png","Arsenal")} Arsenal — Chelsea ${crestImg("teams/61-chelsea.png","Chelsea")}
          </h2>
          <p class="sub">21.09.2026 16:30 UTC</p>
          <div class="disclaimer">Прогноз статистический. Это не совет ставить деньги.</div>
          <div class="card" style="min-height:auto">
            <small style="color:var(--muted)">Исход матча</small>
            <div class="outcomes">
              <div class="outcome is-fav"><small>1</small><div class="pct">52%</div><div>Хозяева</div><div class="hint">Фаворит</div></div>
              <div class="outcome"><small>X</small><div class="pct">24%</div><div>Ничья</div><div class="hint">&nbsp;</div></div>
              <div class="outcome"><small>2</small><div class="pct">24%</div><div>Гости</div><div class="hint">&nbsp;</div></div>
            </div>
            <div class="mix">
              <i style="flex:52;background:var(--accent)"></i>
              <i style="flex:24;background:var(--draw)"></i>
              <i style="flex:24;background:var(--away)"></i>
            </div>
          </div>
          <div class="card scoreboard" style="margin-top:12px">
            <div>
              <small style="color:var(--muted)">Предварительный счёт</small>
              <div class="digits">2:1</div>
              <span class="chip">12%  ·  самый вероятный</span>
            </div>
            <div class="meters">
              <small style="color:var(--muted)">Ожидаемые голы</small>
              <div>
                <div class="meter-row">Arsenal <b>1.64</b></div>
                <div class="meter"><span style="width:55%;background:var(--accent)"></span></div>
              </div>
              <div>
                <div class="meter-row">Chelsea <b>0.96</b></div>
                <div class="meter"><span style="width:32%;background:var(--away)"></span></div>
              </div>
              <p class="sub" style="margin:0">1.64 : 0.96  ·  по голам за 5 матчей</p>
            </div>
          </div>
          <p class="sub" style="margin:16px 0 8px">Контекст матча</p>
          <div class="facts">
            <div class="fact">
              <small>Форма</small>
              <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span style="color:var(--muted);width:64px">Хозяева</span><div class="pills"><i class="pill w">W</i><i class="pill w">W</i><i class="pill d">D</i><i class="pill l">L</i><i class="pill w">W</i></div></div>
              <div style="display:flex;gap:8px;align-items:center"><span style="color:var(--muted);width:64px">Гости</span><div class="pills"><i class="pill w">W</i><i class="pill l">L</i><i class="pill d">D</i><i class="pill d">D</i><i class="pill w">W</i></div></div>
            </div>
            <div class="fact"><small>Рейтинг Elo</small><strong style="font-family:Fira Code">1684  ·  1611</strong><div style="color:var(--muted);font-size:12px;margin-top:4px">разница +73</div></div>
            <div class="fact"><small>Личные встречи</small><strong>2 победы хозяев / 1 ничья</strong></div>
            <div class="fact"><small>Таблица</small><strong style="font-family:Fira Code">2  ·  6</strong><div style="color:var(--muted);font-size:12px;margin-top:4px">20 матчей в кэше</div></div>
          </div>
          <div class="card" style="margin-top:12px;min-height:auto">
            <strong>AI-пояснение</strong>
            <p class="sub" style="margin:8px 0 0">AI не настроен. Добавьте OPENAI_API_KEY в Настройках — числа уже посчитаны локально.</p>
          </div>
        </div>${tabs("forecast")}`;
    }
    function settings() {
      return `${chrome("Football Prognoz — Настройки")}
        <div class="content">
          <h2 class="title">Настройки</h2>
          <div class="form">
            <div>
              <label>FOOTBALL_DATA_API_KEY · обязательный</label><div class="field">••••••••••••</div>
              <label>OPENAI_API_KEY · необязательный</label><div class="field">••••••••••••••••</div>
              <label>OPENAI_MODEL</label><div class="field">gpt-4o-mini</div>
              <label>OPENAI_BASE_URL</label><div class="field">https://api.openai.com/v1</div>
              <button class="cta">Сохранить</button>
            </div>
            <aside class="aside">
              <strong>Локальное хранение ключей</strong>
              <p class="sub">Ключи хранятся только в локальном .env и не попадают в git. Модель Elo + Poisson считает вероятности 1X2 на этом компьютере. Это не совет ставить деньги.</p>
              <p class="sub">football-data.org · лимит 10 запросов/мин</p>
            </aside>
          </div>
        </div>${tabs("settings")}`;
    }
    const screens = { leagues, calendar, forecast, settings };
    let screen = "leagues";
    function render() {
      document.getElementById("main-window").innerHTML = screens[screen]();
      document.getElementById("second-window").innerHTML = screens[screen === "forecast" ? "leagues" : "forecast"]();
    }
    document.getElementById("sizes").addEventListener("click", (e) => {
      const btn = e.target.closest("button"); if (!btn) return;
      document.querySelectorAll("#sizes button").forEach((b) => b.classList.toggle("is-on", b === btn));
      document.getElementById("stage").dataset.size = btn.dataset.size;
    });
    document.body.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-screen]");
      if (!btn || btn.closest("#sizes")) return;
      screen = btn.dataset.screen;
      document.querySelectorAll("#screens button").forEach((b) => b.classList.toggle("is-on", b.dataset.screen === screen));
      render();
    });
    render();
  </script>
</body>
</html>
